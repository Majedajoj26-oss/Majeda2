<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blend - إدارة المنصة التعليمية الشاملة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            padding: 0 20px;
            gap: 5px;
            background: #f8f9fa;
            flex-wrap: wrap;
        }
        
        .tab-button {
            padding: 12px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }
        
        .tab-button:hover {
            color: #667eea;
        }
        
        .content {
            padding: 30px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            flex: 1;
            min-width: 120px;
            font-family: inherit;
        }
        
        .form-group textarea {
            min-height: 60px;
            resize: vertical;
            flex-basis: 100%;
        }
        
        .form-group button {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
            white-space: nowrap;
        }
        
        .form-group button:hover {
            background: #5568d3;
        }
        
        .form-group button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.95em;
        }
        
        #studentsTable, #teachersContent {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        #studentsTable table, #teachersContent table {
            min-width: 100%;
        }
        
        th {
            background: #f0f0f0;
            padding: 12px;
            text-align: right;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .btn-small {
            padding: 6px 12px;
            margin: 0 3px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        
        .btn-delete:hover {
            background: #c82333;
        }
        
        .btn-edit {
            background: #ffc107;
            color: #333;
        }
        
        .btn-edit:hover {
            background: #ffb300;
        }
        
        .btn-info {
            background: #17a2b8;
            color: white;
        }
        
        .btn-info:hover {
            background: #138496;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            opacity: 0.9;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
        }
        
        #message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        #message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .loading-state {
            text-align: center;
            padding: 60px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .schedule-day {
            margin-bottom: 30px;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 20px;
            background: #f8f9ff;
        }
        
        .schedule-day h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .schedule-slot {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-right: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .schedule-slot.stopped {
            border-right-color: #dc3545;
            opacity: 0.6;
        }
        
        .slot-info {
            flex-grow: 1;
        }
        
        .slot-time {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }
        
        .slot-students {
            color: #666;
            margin-top: 5px;
        }
        
        .slot-stopped {
            color: #dc3545;
            font-weight: bold;
            margin-right: 15px;
        }
        
        .section-title {
            margin-top: 30px;
            margin-bottom: 20px;
            font-size: 1.3em;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .expense-card {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            border-right: 4px solid #ffc107;
            margin-bottom: 15px;
        }
        
        .expense-card h4 {
            color: #856404;
            margin-bottom: 5px;
        }
        
        .expense-card .amount {
            font-size: 1.3em;
            font-weight: bold;
            color: #dc3545;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin: 0 5px;
        }
        
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }
        
        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .search-box {
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .reset-bar {
            text-align: left;
            margin-bottom: 10px;
        }

        .reset-bar button {
            background: none;
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .reset-bar button:hover {
            background: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Blend</h1>
            <p>منصة إدارة التعليم الأونلاين الشاملة</p>
        </div>
        
        <div class="tabs">

            <button class="tab-button" onclick="switchTab('schedule', this)">📅 جدول المواعيد</button>
            <button class="tab-button" onclick="switchTab('expenses', this)">💰 المصاريف</button>
            <button class="tab-button" onclick="switchTab('analytics', this)">📊 التحليلات</button>
            <button class="tab-button" onclick="switchTab('teachers', this)">👨‍🏫 المعلمات</button>
        </div>
        
        <div class="content">
            <div id="message"></div>
            
            <!-- تبويب الطالبات -->
            <div id="students" class="tab-content active">
                <h2>إدارة الطالبات</h2>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 ابحث عن طالبة..." onkeyup="filterStudents()">
                </div>
                
                <div class="form-group">
                    <input type="text" id="studentName" placeholder="اسم الطالبة">
                    <select id="section">
                        <option>قرآن</option>
                        <option>عربي</option>
                        <option>انجليزي</option>
                    </select>
                    <input type="date" id="joinDate" placeholder="تاريخ الانضمام">
                    <input type="number" id="monthlyRate" placeholder="السعر الشهري" min="0" step="0.5">
                    <select id="teacher">
                        <option value="1">مس بتول (قرآن)</option>
                        <option value="2">مس إشراق (عربي)</option>
                        <option value="3">مس مها (انجليزي)</option>
                    </select>
                    <button id="studentSubmitBtn" onclick="addStudent()">➕ إضافة</button>
                </div>
                
                <div id="studentsTable"><div class="loading-state">جارٍ التحميل...</div></div>
            </div>
            
            <!-- تبويب جدول المواعيد -->
            <div id="schedule" class="tab-content">
                <h2>📅 جدول المواعيد الأسبوعي</h2>
                <div id="scheduleContent"></div>
            </div>
            
            <!-- تبويب المصاريف -->
            <div id="expenses" class="tab-content">
                <h2>💰 إدارة المصاريف والمكافآت ورأس المال</h2>
                
                <div class="form-group">
                    <input type="text" id="expenseName" placeholder="نوع البند (مثال: مكافأة ماجدة، رأس مال)">
                    <input type="number" id="expenseAmount" placeholder="المبلغ" min="0" step="0.5">
                    <input type="text" id="expenseDescription" placeholder="وصف البند">
                    <input type="date" id="expenseDate">
                    <button onclick="addExpense()">➕ إضافة بند</button>
                </div>
                
                <div id="expensesContent"><div class="loading-state">جارٍ التحميل...</div></div>
            </div>
            
            <!-- تبويب التحليلات -->
            <div id="analytics" class="tab-content">
                <h2>📊 التحليلات والأرباح</h2>
                <div id="analyticsContent"></div>
            </div>
            
            <!-- تبويب المعلمات -->
            <div id="teachers" class="tab-content">
                <h2>👨‍🏫 إدارة المعلمات</h2>
                <div class="reset-bar">
                    <button onclick="resetAllData()">🗑️ إعادة تعيين كل البيانات</button>
                </div>
                <div id="teachersContent"></div>
            </div>
        </div>
    </div>

        </div>
    </div>

            { id: 16, name: 'لجين', section: 'عربي', joinDate: '2026-04-01', monthlyRate: 40, teacher: 2, paymentStatus: 'متوقف', totalPaid: 80, payments: [40, 40], giftSessions: 0, giftAmount: 0, notes: '🛑 متوقفة - مس إشراق - دفعتان' },
            { id: 17, name: 'هاشم', section: 'عربي', joinDate: '2026-08-01', monthlyRate: 40, teacher: 2, paymentStatus: 'نشط', totalPaid: 40, payments: [40], giftSessions: 0, giftAmount: 0, notes: '✨ مس إشراق - دفعة واحدة' },
            { id: 18, name: 'هاشم', section: 'قرآن', joinDate: '2026-08-19', monthlyRate: 20, teacher: 1, paymentStatus: 'مدفوع', totalPaid: 20, payments: [20], giftSessions: 0, giftAmount: 0, notes: 'مس بتول - دفعة واحدة' }
        ];

        // تحميل البيانات المحفوظة (باستخدام نظام التخزين الدائم بدل localStorage)
        async function loadData() {
            try {
                const savedStudents = await window.storage.get('students', false);
                students = savedStudents ? JSON.parse(savedStudents.value) : initialStudents;
            } catch (e) {
                students = initialStudents;
            }
            try {
                const savedExpenses = await window.storage.get('expenses', false);
                expenses = savedExpenses ? JSON.parse(savedExpenses.value) : initialExpenses;
            } catch (e) {
                expenses = initialExpenses;
            }

            // إذا كانت أول مرة، احفظ البيانات الابتدائية
            await saveData();

            filteredStudents = [...students];
            renderAll();
        }

        window.addEventListener('load', function() {
            loadData();
        });

        function switchTab(tabName, button) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            button.classList.add('active');
            
            if (tabName === 'schedule') renderSchedule();
            if (tabName === 'expenses') renderExpenses();
            if (tabName === 'analytics') renderAnalytics();
            if (tabName === 'teachers') renderTeachers();
        }

        async function saveData() {
            try {
                await window.storage.set('students', JSON.stringify(students), false);
                await window.storage.set('expenses', JSON.stringify(expenses), false);
            } catch (e) {
                showMessage('⚠️ حدث خطأ أثناء الحفظ، حاول مرة أخرى', true);
            }
        }

        async function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            const section = document.getElementById('section').value;
            const joinDate = document.getElementById('joinDate').value;
            const monthlyRate = parseFloat(document.getElementById('monthlyRate').value);
            const teacher = parseInt(document.getElementById('teacher').value);

            if (!name || !joinDate || !monthlyRate) {
                alert('الرجاء ملء جميع الحقول المطلوبة');
                return;
            }

            const btn = document.getElementById('studentSubmitBtn');
            btn.disabled = true;

            if (editingId) {
                const student = students.find(s => s.id === editingId);
                student.name = name;
                student.section = section;
                student.joinDate = joinDate;
                student.monthlyRate = monthlyRate;
                student.teacher = teacher;
                editingId = null;
                btn.textContent = '➕ إضافة';
            } else {
                students.push({
                    id: Date.now(),
                    name,
                    section,
                    joinDate,
                    monthlyRate,
                    teacher,
                    paymentStatus: 'نشط',
                    totalPaid: monthlyRate,
                    payments: [monthlyRate],
                    giftSessions: 0,
                    giftAmount: 0,
                    notes: ''
                });
            }

            await saveData();
            clearForm();
            filteredStudents = [...students];
            renderAll();
            showMessage('تم الحفظ بنجاح ✓');
            btn.disabled = false;
        }

        function editStudent(id) {
            const student = students.find(s => s.id === id);
            document.getElementById('studentName').value = student.name;
            document.getElementById('section').value = student.section;
            document.getElementById('joinDate').value = student.joinDate;
            document.getElementById('monthlyRate').value = student.monthlyRate;
            document.getElementById('teacher').value = student.teacher;
            editingId = id;
            document.getElementById('studentSubmitBtn').textContent = '✏️ تحديث';
            window.scrollTo(0, 0);
        }

        async function deleteStudent(id) {
            if (confirm('هل متأكد من الحذف؟')) {
                students = students.filter(s => s.id !== id);
                filteredStudents = [...students];
                await saveData();
                renderAll();
                showMessage('تم الحذف ✓');
            }
        }

        function filterStudents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredStudents = students.filter(s => 
                s.name.toLowerCase().includes(searchTerm) ||
                s.section.includes(searchTerm)
            );
            renderStudents();
        }

        function showStudentDetails(id) {
            const student = students.find(s => s.id === id);
            const days = Object.keys(schedule);
            let scheduleHTML = '';
            
            days.forEach(day => {
                schedule[day].forEach(slot => {
                    if (slot.students.includes(student.name)) {
                        scheduleHTML += `<p>🕐 ${day} - ${slot.time}</p>`;
                    }
                });
            });
            
            const modal = document.getElementById('studentModal');
            const modalBody = document.getElementById('modalBody');
            
            const joinDateObj = new Date(student.joinDate);
            const expectedAmount = student.monthlyRate * (student.payments.length);
            const remaining = expectedAmount - student.totalPaid;
            
            let paymentsHTML = '<h4>📊 سجل الدفعات:</h4>';
            if (student.payments.length === 0) {
                paymentsHTML += '<p>لم يتم أي دفعات</p>';
            } else {
                paymentsHTML += '<ul style="list-style: none;">';
                student.payments.forEach((payment, index) => {
                    paymentsHTML += `<li style="padding: 8px; margin: 5px 0; background: #d4edda; border-radius: 5px;">✅ الدفعة ${index + 1}: ${payment} د</li>`;
                });
                paymentsHTML += '</ul>';
            }
            
            modalBody.innerHTML = `
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <p><strong>👤 الاسم:</strong> ${student.name}</p>
                    <p><strong>📚 القسم:</strong> ${student.section}</p>
                    <p><strong>👨‍🏫 المعلمة:</strong> ${teachers.find(t => t.id === student.teacher).name}</p>
                    <p><strong>📅 تاريخ الانضمام:</strong> ${joinDateObj.toLocaleDateString('en-CA')}</p>
                </div>
                
                <div style="background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <p><strong>💰 السعر الشهري:</strong> <span style="font-size: 1.2em; color: #856404;">${student.monthlyRate} د</span></p>
                    <p><strong>📈 عدد الدفعات:</strong> ${student.payments.length}</p>
                    <p><strong>✅ إجمالي المدفوع:</strong> <span style="font-weight: bold; color: #155724;">${student.totalPaid} د</span></p>
                    ${remaining > 0 ? `<p style="color: #dc3545;"><strong>❌ المتبقي:</strong> ${remaining} د</p>` : '<p style="color: #155724;"><strong>✅ مسدد</strong></p>'}
                </div>
                
                <div style="background: #e7f3ff; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <p><strong>📋 حالة الدفع:</strong> <span class="badge ${student.paymentStatus === 'مدفوع' || student.paymentStatus === 'نشط' ? 'badge-success' : 'badge-warning'}">${student.paymentStatus}</span></p>
                    ${student.notes ? `<p><strong>📝 ملاحظات:</strong> ${student.notes}</p>` : ''}
                </div>
                
                ${scheduleHTML ? `<div style="background: #f0f8ff; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <h4>🕐 المواعيد:</h4>
                    ${scheduleHTML}
                </div>` : ''}
                
                ${paymentsHTML}
            `;
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('studentModal').classList.remove('active');
        }

        async function addExpense() {
            const name = document.getElementById('expenseName').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const description = document.getElementById('expenseDescription').value;
            const date = document.getElementById('expenseDate').value;

            if (!name || !amount || !date) {
                alert('الرجاء ملء البيانات المطلوبة');
                return;
            }

            expenses.push({
                id: Date.now(),
                name,
                amount,
                description,
                date
            });

            await saveData();
            document.getElementById('expenseName').value = '';
            document.getElementById('expenseAmount').value = '';
            document.getElementById('expenseDescription').value = '';
            document.getElementById('expenseDate').value = '';
            
            renderExpenses();
            showMessage('تم إضافة البند بنجاح ✓');
        }

        async function deleteExpense(id) {
            if (confirm('هل متأكد من الحذف؟')) {
                expenses = expenses.filter(e => e.id !== id);
                await saveData();
                renderExpenses();
                showMessage('تم الحذف ✓');
            }
        }

        async function resetAllData() {
            if (confirm('سيؤدي هذا لحذف كل البيانات المحفوظة والعودة للبيانات الافتراضية. هل أنت متأكدة؟')) {
                students = JSON.parse(JSON.stringify(initialStudents));
                expenses = JSON.parse(JSON.stringify(initialExpenses));
                await saveData();
                filteredStudents = [...students];
                renderAll();
                renderExpenses();
                renderAnalytics();
                renderTeachers();
                showMessage('تمت إعادة التعيين ✓');
            }
        }

        function clearForm() {
            document.getElementById('studentName').value = '';
            document.getElementById('section').value = 'قرآن';
            document.getElementById('joinDate').value = '';
            document.getElementById('monthlyRate').value = '';
            document.getElementById('teacher').value = '1';
        }

        function showMessage(msg, isError) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = msg;
            msgEl.className = isError ? 'error' : '';
            msgEl.style.display = 'block';
            setTimeout(() => msgEl.style.display = 'none', 3000);
        }

        function getStats() {
            const totalRevenue = students.reduce((sum, s) => sum + s.totalPaid, 0);
            const totalExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);
            // الرصيد ناتج فعلي عن طرح المصاريف من الإيرادات، وليس رقمًا ثابتًا
            const netProfit = totalRevenue - totalExpenses;
            const totalStudents = students.length;
            const teachersProfit = totalRevenue * 0.5;
            const platformProfit = totalRevenue * 0.5 - totalExpenses;

            return { totalRevenue, totalExpenses, netProfit, totalStudents, teachersProfit, platformProfit };
        }

        function renderStudents() {
            let html = '';
            if (filteredStudents.length === 0) {
                html = '<div class="empty-state"><p>لا توجد طالبات مسجلة</p></div>';
            } else {
                html += '<table><thead><tr><th>الاسم</th><th>القسم</th><th>المعلمة</th><th>تاريخ الانضمام</th><th>السعر</th><th>عدد الدفعات</th><th>المدفوع</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>';
                filteredStudents.forEach(student => {
                    const teacher = teachers.find(t => t.id === student.teacher);
                    html += `<tr>
                        <td><strong>${student.name}</strong></td>
                        <td>${student.section}</td>
                        <td>${teacher ? teacher.name : '-'}</td>
                        <td>${new Date(student.joinDate).toLocaleDateString('en-CA')}</td>
                        <td>${student.monthlyRate} د</td>
                        <td><strong>${student.payments.length}</strong></td>
                        <td style="color: #155724; font-weight: bold;">${student.totalPaid} د</td>
                        <td><span class="badge ${student.paymentStatus === 'مدفوع' || student.paymentStatus === 'نشط' ? 'badge-success' : student.paymentStatus === 'هدية' ? 'badge-info' : student.paymentStatus === 'متوقف' ? 'badge-danger' : 'badge-warning'}">${student.paymentStatus}</span></td>
                        <td>
                            <button class="btn-small btn-info" onclick="showStudentDetails(${student.id})">عرض</button>
                            <button class="btn-small btn-edit" onclick="editStudent(${student.id})">تعديل</button>
                            <button class="btn-small btn-delete" onclick="deleteStudent(${student.id})">حذف</button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }
            document.getElementById('studentsTable').innerHTML = html;
        }

        function renderSchedule() {
            let html = '';
            const days = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
            
            days.forEach(day => {
                html += `<div class="schedule-day">
                    <h3>${day}</h3>`;
                    
                schedule[day].forEach(slot => {
                    const stopClass = slot.stopped ? 'stopped' : '';
                    html += `<div class="schedule-slot ${stopClass}">
                        <div class="slot-info">
                            <div class="slot-time">🕐 ${slot.time}</div>
                            <div class="slot-students">👥 ${slot.students}</div>
                        </div>`;
                    
                    if (slot.stopped) {
                        html += `<div class="slot-stopped">🛑 متوقف</div>`;
                    }
                    
                    html += `</div>`;
                });
                
                html += `</div>`;
            });
            
            document.getElementById('scheduleContent').innerHTML = html;
        }

        function renderExpenses() {
            const stats = getStats();
            let html = `<div class="stats">
                <div class="stat-card">
                    <h3>💸 إجمالي المصاريف والبنود</h3>
                    <div class="value">${stats.totalExpenses.toFixed(2)} د</div>
                </div>
                <div class="stat-card">
                    <h3>💰 إجمالي الإيرادات</h3>
                    <div class="value">${stats.totalRevenue.toFixed(2)} د</div>
                </div>
                <div class="stat-card">
                    <h3>📈 صافي الأرباح/الرصيد</h3>
                    <div class="value">${stats.netProfit.toFixed(2)} د</div>
                </div>
            </div>`;
            
            html += '<h3 class="section-title">📋 قائمة المصاريف والمكافآت ورأس المال</h3>';
            
            if (expenses.length === 0) {
                html += '<div class="empty-state"><p>لا توجد بنود مسجلة</p></div>';
            } else {
                expenses.forEach(expense => {
                    html += `<div class="expense-card">
                        <h4>💰 ${expense.name}</h4>
                        <div class="amount">${expense.amount} د</div>
                        <p>📅 ${new Date(expense.date).toLocaleDateString('en-CA')}</p>
                        ${expense.description ? `<p>📝 ${expense.description}</p>` : ''}
                        <button class="btn-small btn-delete" onclick="deleteExpense(${expense.id})">حذف</button>
                    </div>`;
                });
            }
            
            document.getElementById('expensesContent').innerHTML = html;
        }

        function renderAnalytics() {
            const stats = getStats();
            const paidStudents = students.filter(s => s.paymentStatus === 'مدفوع' || s.paymentStatus === 'نشط').length;
            const pendingStudents = students.filter(s => s.paymentStatus === 'معلق').length;
            
            let html = `
                <div class="stats">
                    <div class="stat-card">
                        <h3>💰 إجمالي الإيرادات المحصلة</h3>
                        <div class="value">${stats.totalRevenue.toFixed(2)} د</div>
                    </div>
                    <div class="stat-card">
                        <h3>💸 إجمالي المصاريف والمكافآت</h3>
                        <div class="value">${stats.totalExpenses.toFixed(2)} د</div>
                    </div>
                    <div class="stat-card">
                        <h3>📈 صافي الأرباح</h3>
                        <div class="value">${stats.netProfit.toFixed(2)} د</div>
                    </div>
                    <div class="stat-card">
                        <h3>👥 عدد الطالبات</h3>
                        <div class="value">${stats.totalStudents}</div>
                    </div>
                    <div class="stat-card">
                        <h3>✅ نشط/مدفوع</h3>
                        <div class="value">${paidStudents}</div>
                    </div>
                    <div class="stat-card">
                        <h3>⏳ معلق</h3>
                        <div class="value">${pendingStudents}</div>
                    </div>
                </div>
                
                <h3 class="section-title">📊 توزيع الأرباح حسب القسم</h3>
                <div style="overflow-x: auto; width: 100%;">
                    <table style="width: 100%; min-width: 900px;">
                        <thead>
                            <tr style="background: #667eea; color: white;">
                                <th>📚 القسم</th>
                                <th>👨‍🏫 المعلمة</th>
                                <th>👥 عدد الطالبات</th>
                                <th>💰 إجمالي الإيرادات</th>
                                <th>💵 نصيب المعلمة (50%)</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            const sections = ['قرآن', 'انجليزي', 'عربي'];
            sections.forEach(section => {
                const sectionStudents = students.filter(s => s.section === section);
                if (sectionStudents.length > 0) {
                    const sectionRevenue = sectionStudents.reduce((sum, s) => sum + s.totalPaid, 0);
                    const sectionTeacher = teachers.find(t => {
                        const t_students = students.filter(s => s.teacher === t.id);
                        return t_students.some(s => s.section === section);
                    });
                    const teacherShare = sectionRevenue * 0.5;
                    
                    html += `<tr style="border-bottom: 2px solid #ddd;">
                        <td><strong style="color: #667eea;">${section}</strong></td>
                        <td><strong>${sectionTeacher ? sectionTeacher.name : '-'}</strong></td>
                        <td style="text-align: center;"><span style="background: #e3f2fd; padding: 5px 10px; border-radius: 20px; font-weight: bold;">${sectionStudents.length}</span></td>
                        <td style="background: #f0f7ff;"><strong style="color: #1976d2; font-size: 1.1em;">${sectionRevenue.toFixed(2)} د</strong></td>
                        <td style="background: #f3e5f5;"><strong style="color: #7b1fa2; font-size: 1.1em;">${teacherShare.toFixed(2)} د</strong></td>
                    </tr>`;
                }
            });
            
            html += `</tbody></table></div>`;
            document.getElementById('analyticsContent').innerHTML = html;
        }

        function renderTeachers() {
            let html = `
                <div style="overflow-x: auto; width: 100%;">
                    <table style="width: 100%; min-width: 1000px;">
                        <thead>
                            <tr>
                                <th>👨‍🏫 اسم المعلمة</th>
                                <th>📚 القسم</th>
                                <th>👥 عدد الطالبات</th>
                                <th>📝 أسماء الطالبات</th>
                                <th>📊 الإيرادات</th>
                                <th>💵 الأرباح (50%)</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            teachers.forEach(teacher => {
                const teacherStudents = students.filter(s => s.teacher === teacher.id);
                const studentNames = teacherStudents.map(s => `<strong>${s.name}</strong> (${s.totalPaid} د)`).join('<br>');
                const teacherRevenue = teacherStudents.reduce((sum, s) => sum + s.totalPaid, 0);
                const teacherProfit = teacherRevenue * 0.5;
                
                html += `<tr style="border-bottom: 2px solid #ddd;">
                    <td><strong style="font-size: 1.1em; color: #667eea;">${teacher.name}</strong></td>
                    <td><strong>${teacher.section}</strong></td>
                    <td><span style="background: #e3f2fd; padding: 5px 10px; border-radius: 20px; font-weight: bold;">${teacherStudents.length}</span></td>
                    <td style="text-align: right;">${studentNames || '-'}</td>
                    <td style="background: #f0f7ff;"><strong style="color: #1976d2;">${teacherRevenue.toFixed(2)} د</strong></td>
                    <td style="background: #f3e5f5;"><strong style="color: #7b1fa2; font-size: 1.1em;">${teacherProfit.toFixed(2)} د</strong></td>
                </tr>`;
            });
            
            html += `</tbody></table></div>`;
            document.getElementById('teachersContent').innerHTML = html;
        }

        function renderAll() {
            renderStudents();
            renderSchedule();
        }

        document.addEventListener('click', function(event) {
            const modal = document.getElementById('studentModal');
            if (event.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
