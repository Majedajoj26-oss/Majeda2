<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blend - إدارة المنصة التعليمية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 12px;
            -webkit-touch-callout: none;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px;
            }

            .container {
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 5px;
            }

            .container {
                border-radius: 8px;
                box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            }
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 15px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 10px;
            }

            .header h1 {
                font-size: 1.5em;
                margin-bottom: 5px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 12px 8px;
            }

            .header h1 {
                font-size: 1.3em;
            }
        }
        
        .tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            padding: 0 10px;
            gap: 3px;
            background: #f8f9fa;
            flex-wrap: wrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .tab-button {
            padding: 10px 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.9em;
            white-space: nowrap;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .tabs {
                padding: 0 8px;
                gap: 2px;
            }

            .tab-button {
                font-size: 0.8em;
                padding: 8px 10px;
            }
        }

        @media (max-width: 480px) {
            .tab-button {
                font-size: 0.7em;
                padding: 6px 8px;
            }
        }
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: 600;
        }
        
        .tab-button:hover {
            color: #667eea;
        }
        
        .content {
            padding: 20px 15px;
        }

        @media (max-width: 768px) {
            .content {
                padding: 15px 10px;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 10px 8px;
            }
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .form-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .form-group input,
        .form-group select {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9em;
            flex: 1;
            min-width: 80px;
            font-family: inherit;
        }

        @media (max-width: 768px) {
            .form-group {
                gap: 6px;
                margin-bottom: 12px;
            }

            .form-group input,
            .form-group select {
                font-size: 0.8em;
                padding: 6px 8px;
                min-width: 70px;
            }
        }

        @media (max-width: 480px) {
            .form-group input,
            .form-group select {
                font-size: 0.75em;
                padding: 5px 6px;
                min-width: 60px;
            }
        }
        
        .form-group button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
            white-space: nowrap;
            min-width: 80px;
        }
        
        .form-group button:hover {
            background: #5568d3;
        }

        @media (max-width: 768px) {
            .form-group button {
                font-size: 0.8em;
                padding: 6px 12px;
                min-width: 70px;
            }
        }

        @media (max-width: 480px) {
            .form-group button {
                font-size: 0.75em;
                padding: 5px 10px;
                min-width: 60px;
            }
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.9em;
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            min-width: 100%;
        }

        thead {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        tbody {
            display: block;
            overflow: visible;
        }

        tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        th, td {
            padding: 10px;
            text-align: right;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            min-width: 60px;
        }

        @media (max-width: 768px) {
            table {
                font-size: 0.75em;
                white-space: normal;
            }

            th, td {
                padding: 6px 5px !important;
                min-width: 50px;
            }
        }

        @media (max-width: 480px) {
            table {
                font-size: 0.7em;
            }

            th, td {
                padding: 4px 3px !important;
                min-width: 40px;
            }
        }
        
        th {
            background: #f0f0f0;
            padding: 8px;
            text-align: right;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
            font-size: 0.9em;
            word-wrap: break-word;
            word-break: break-word;
        }
        
        td {
            padding: 8px;
            border-bottom: 1px solid #eee;
            word-wrap: break-word;
            word-break: break-word;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .btn-small {
            padding: 4px 8px;
            margin: 0 2px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8em;
            min-width: 50px;
        }

        @media (max-width: 768px) {
            .btn-small {
                font-size: 0.7em;
                padding: 3px 6px;
                min-width: 45px;
            }
        }
        
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        
        .btn-delete:hover {
            background: #c82333;
        }
        
        .btn-edit {
            background: #ffc107;
            color: #333;
        }
        
        .btn-edit:hover {
            background: #ffb300;
        }
        
        .btn-info {
            background: #17a2b8;
            color: white;
        }
        
        .btn-info:hover {
            background: #138496;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            opacity: 0.9;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-card.success {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }
        
        .stat-card.danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }
        
        .stat-card.warning {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
        }
        
        #message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .loading-state {
            text-align: center;
            padding: 60px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        .section-title {
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 1.1em;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        @media (max-width: 768px) {
            .section-title {
                margin-top: 15px;
                margin-bottom: 10px;
                font-size: 1em;
                padding-bottom: 6px;
            }
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .badge-gift {
            background: #e8daef;
            color: #6f42c1;
        }
        
        .search-box {
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .reset-bar {
            text-align: left;
            margin-bottom: 10px;
        }

        .reset-bar button {
            background: none;
            border: 1px solid #dc3545;
            color: #dc3545;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .reset-bar button:hover {
            background: #dc3545;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .expense-item {
            background: #fff3cd;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid #ffc107;
        }

        .expense-item strong {
            color: #856404;
        }

        .income-item {
            background: #d4edda;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid #28a745;
        }

        .income-item strong {
            color: #155724;
        }

        /* السحب الأفقي السلس للجداول على الأجهزة المحمولة */
        div[style*="overflow-x"] {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            cursor: grab;
        }

        div[style*="overflow-x"]:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Blend</h1>
            <p>منصة إدارة التعليم الأونلاين</p>
        </div>
        
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('sessions', this)">📅 مواعيد الحصص</button>
            <button class="tab-button" onclick="switchTab('students', this)">👥 الطالبات</button>
            <button class="tab-button" onclick="switchTab('expenses', this)">💸 المصاريف</button>
            <button class="tab-button" onclick="switchTab('profit', this)">📊 صافي الربح</button>
            <button class="tab-button" onclick="switchTab('teachers', this)">👨‍🏫 المعلمات</button>
        </div>
        
        <div class="content">
            <div id="message"></div>
            
            <!-- تبويب الحصص -->
            <div id="sessions" class="tab-content active">
                <h2>📅 مواعيد الحصص</h2>
                
                <div class="form-group">
                    <select id="sessionTeacher">
                        <option value="">اختر المعلمة</option>
                        <option value="1">مس بتول (قرآن)</option>
                        <option value="2">مس إشراق (عربي/حروف)</option>
                        <option value="3">مس مها (انجليزي)</option>
                    </select>
                    <select id="sessionDate">
                        <option value="">اختر اليوم</option>
                        <option value="الخميس">الخميس</option>
                        <option value="السبت">السبت</option>
                        <option value="الأحد">الأحد</option>
                        <option value="الاثنين">الاثنين</option>
                        <option value="الثلاثاء">الثلاثاء</option>
                        <option value="الأربعاء">الأربعاء</option>
                    </select>
                    <input type="time" id="sessionTime" placeholder="وقت الحصة">
                    <input type="text" id="sessionStudents" placeholder="الطالبات">
                    <input type="text" id="sessionSection" placeholder="القسم">
                    <button onclick="addSession()">➕ إضافة حصة</button>
                </div>
                
                <div id="sessionsTable"></div>
            </div>
            
            <!-- تبويب الطالبات -->
            <div id="students" class="tab-content">
                <h2>إدارة الطالبات</h2>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 ابحث عن طالبة..." onkeyup="filterStudents()">
                </div>
                
                <div class="form-group">
                    <input type="text" id="studentName" placeholder="اسم الطالبة">
                    <select id="section">
                        <option>قرآن</option>
                        <option>عربي</option>
                        <option>انجليزي</option>
                        <option>حروف</option>
                    </select>
                    <input type="date" id="joinDate" placeholder="تاريخ الانضمام">
                    <input type="number" id="monthlyRate" placeholder="السعر الشهري" min="0" step="0.5">
                    <select id="teacher">
                        <option value="1">مس بتول (قرآن)</option>
                        <option value="2">مس إشراق (عربي/حروف)</option>
                        <option value="3">مس مها (انجليزي)</option>
                    </select>
                    <button id="studentSubmitBtn" onclick="addStudent()">➕ إضافة</button>
                </div>
                
                <div id="studentsTable"><div class="loading-state">جارٍ التحميل...</div></div>
            </div>
            
            <!-- تبويب المصاريف -->
            <div id="expenses" class="tab-content">
                <h2>💸 المصاريف</h2>

                <div class="form-group">
                    <input type="text" id="expenseName" placeholder="اسم المصروف">
                    <input type="number" id="expenseAmount" placeholder="المبلغ" min="0" step="0.01">
                    <button onclick="addExpense()">➕ إضافة مصروف</button>
                </div>

                <div id="expensesContent"></div>
            </div>

            <!-- تبويب صافي الربح -->
            <div id="profit" class="tab-content">
                <h2>📊 صافي الربح</h2>
                <div id="profitContent"></div>
            </div>
            
            <!-- تبويب المعلمات -->
            <div id="teachers" class="tab-content">
                <h2>👨‍🏫 توزيع الأرباح على المعلمات</h2>
                <div class="reset-bar">
                    <button onclick="resetAllData()">🗑️ إعادة تعيين البيانات</button>
                </div>
                <div id="teachersContent"></div>
            </div>
        </div>
    </div>

    <!-- Modal لتفاصيل الطالبة -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h2>تفاصيل الطالبة</h2>
            <div id="modalBody"></div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="closeModal()">إغلاق</button>
            </div>
        </div>
    </div>

        function loadData() {
            const DATA_VERSION = 13;
            try {
                const savedVersion = localStorage.getItem('blendVersion');
                const needsRefresh = savedVersion !== DATA_VERSION.toString();

                if (needsRefresh) {
                    students = JSON.parse(JSON.stringify(initialStudents));
                    customExpenses = JSON.parse(JSON.stringify(defaultExpenses));
                    sessions = JSON.parse(JSON.stringify(defaultSessions));
                } else {
                    const savedStudents = localStorage.getItem('blendStudents');
                    const savedExpenses = localStorage.getItem('blendExpenses');
                    const savedSessions = localStorage.getItem('blendSessions');
                    students = savedStudents ? JSON.parse(savedStudents) : initialStudents;
                    customExpenses = savedExpenses ? JSON.parse(savedExpenses) : defaultExpenses;
                    sessions = savedSessions ? JSON.parse(savedSessions) : defaultSessions;
                }

                localStorage.setItem('blendVersion', DATA_VERSION.toString());
                saveData();
                filteredStudents = [...students];
                renderAll();
            } catch (e) {
                console.error('خطأ:', e);
                students = initialStudents;
                customExpenses = defaultExpenses;
                sessions = defaultSessions;
                filteredStudents = [...students];
                renderAll();
            }
        }

        window.addEventListener('load', loadData);

        function switchTab(tabName, button) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            button.classList.add('active');
            
            if (tabName === 'sessions') renderSessions();
            if (tabName === 'expenses') renderExpenses();
            if (tabName === 'profit') renderProfit();
            if (tabName === 'teachers') renderTeachers();
        }

        function addSession() {
            const teacher = document.getElementById('sessionTeacher').value;
            const day = document.getElementById('sessionDay')?.value || document.getElementById('sessionDate')?.value;
            const time = document.getElementById('sessionTime').value;
            const students = document.getElementById('sessionStudents')?.value || '';
            const section = document.getElementById('sessionSection')?.value || 'قرآن';

            if (!teacher || !day || !time) {
                alert('الرجاء ملء المعلومات المطلوبة');
                return;
            }

            if (editingSessionId) {
                const session = sessions.find(s => s.id === editingSessionId);
                if (session) {
                    session.teacher = teacher;
                    session.day = day;
                    session.time = time;
                    session.students = students;
                    session.section = section;
                }
                editingSessionId = null;
            } else {
                sessions.push({
                    id: Date.now(),
                    teacher,
                    day,
                    time,
                    students,
                    section
                });
            }

            saveData();
            clearSessionForm();
            renderSessions();
            showMessage('تم الحفظ بنجاح ✓');
        }

        function editSession(id) {
            const session = sessions.find(s => s.id === id);
            if (session) {
                document.getElementById('sessionTeacher').value = session.teacher;
                document.getElementById('sessionDate').value = session.day;
                document.getElementById('sessionTime').value = session.time;
                if (document.getElementById('sessionStudents')) {
                    document.getElementById('sessionStudents').value = session.students || '';
                }
                if (document.getElementById('sessionSection')) {
                    document.getElementById('sessionSection').value = session.section || 'قرآن';
                }
                editingSessionId = id;
                window.scrollTo(0, 0);
            }
        }

        function deleteSession(id) {
            if (confirm('هل متأكد من حذف هذه الحصة؟')) {
                sessions = sessions.filter(s => s.id !== id);
                saveData();
                renderSessions();
                showMessage('تم الحذف ✓');
            }
        }

        function clearSessionForm() {
            document.getElementById('sessionTeacher').value = '';
            document.getElementById('sessionDate').value = '';
            document.getElementById('sessionTime').value = '';
            if (document.getElementById('sessionStudents')) {
                document.getElementById('sessionStudents').value = '';
            }
            if (document.getElementById('sessionSection')) {
                document.getElementById('sessionSection').value = 'قرآن';
            }
        }

        function renderSessions() {
            const days = ['الخميس', 'السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء'];
            let html = '';
            
            days.forEach(day => {
                const daySessions = sessions.filter(s => s.day === day);
                
                if (daySessions.length > 0) {
                    html += `
                    <h3 class="section-title">📅 ${day}</h3>
                    <div style="overflow-x: auto;">
                        <table>
                            <thead>
                                <tr style="background: #667eea; color: white;">
                                    <th>الوقت</th>
                                    <th>الطالبات</th>
                                    <th>المعلمة</th>
                                    <th>القسم</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    daySessions.sort((a, b) => a.time.localeCompare(b.time)).forEach(session => {
                        const teacher = teachers.find(t => t.id == session.teacher);
                        html += `<tr>
                            <td><strong>${session.time}</strong></td>
                            <td>${session.students}</td>
                            <td><strong>${teacher?.name || '-'}</strong></td>
                            <td>${session.section}</td>
                            <td>
                                <button class="btn-small btn-edit" onclick="editSession(${session.id})">تعديل</button>
                                <button class="btn-small btn-delete" onclick="deleteSession(${session.id})">حذف</button>
                            </td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table></div>';
                }
            });
            
            if (html === '') {
                html = '<div class="empty-state"><p>لا توجد حصص مجدولة</p></div>';
            }
            
            document.getElementById('sessionsTable').innerHTML = html;
        }

        function saveData() {
            try {
                localStorage.setItem('blendStudents', JSON.stringify(students));
                localStorage.setItem('blendExpenses', JSON.stringify(customExpenses));
                localStorage.setItem('blendSessions', JSON.stringify(sessions));
            } catch (e) {
                showMessage('⚠️ خطأ في الحفظ', true);
            }
        }

        function addExpense() {
            const name = document.getElementById('expenseName').value.trim();
            const amount = parseFloat(document.getElementById('expenseAmount').value);

            if (!name || isNaN(amount) || amount <= 0) {
                alert('الرجاء إدخال اسم المصروف والمبلغ');
                return;
            }

            if (editingExpenseId) {
                const expense = customExpenses.find(e => e.id === editingExpenseId);
                if (expense) {
                    expense.name = name;
                    expense.amount = amount;
                }
                editingExpenseId = null;
            } else {
                customExpenses.push({
                    id: Date.now(),
                    name,
                    amount
                });
            }

            saveData();
            clearExpenseForm();
            renderExpenses();
            showMessage('تم الحفظ بنجاح ✓');
        }

        function editExpense(id) {
            const expense = customExpenses.find(e => e.id === id);
            if (expense) {
                document.getElementById('expenseName').value = expense.name;
                document.getElementById('expenseAmount').value = expense.amount;
                editingExpenseId = id;
                window.scrollTo(0, 0);
            }
        }

        function deleteExpense(id) {
            if (confirm('هل متأكد من حذف هذا المصروف؟')) {
                customExpenses = customExpenses.filter(e => e.id !== id);
                saveData();
                renderExpenses();
                showMessage('تم الحذف ✓');
            }
        }

        function clearExpenseForm() {
            document.getElementById('expenseName').value = '';
            document.getElementById('expenseAmount').value = '';
        }

        async function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            const section = document.getElementById('section').value;
            const joinDate = document.getElementById('joinDate').value;
            const monthlyRate = parseFloat(document.getElementById('monthlyRate').value);
            const teacher = parseInt(document.getElementById('teacher').value);

            if (!name || !joinDate || !monthlyRate) {
                alert('الرجاء ملء جميع الحقول');
                return;
            }

            const btn = document.getElementById('studentSubmitBtn');
            btn.disabled = true;

            if (editingId) {
                const student = students.find(s => s.id === editingId);
                if (student) {
                    student.name = name;
                    student.section = section;
                    student.joinDate = joinDate;
                    student.monthlyRate = monthlyRate;
                    student.teacher = teacher;
                }
                editingId = null;
                btn.textContent = '➕ إضافة';
            } else {
                students.push({
                    id: Date.now(),
                    name,
                    section,
                    joinDate,
                    monthlyRate,
                    teacher,
                    totalPaid: monthlyRate,
                    payments: [monthlyRate],
                    isGift: false,
                    isSpecial: false
                });
            }

            saveData();
            clearForm();
            filteredStudents = [...students];
            renderAll();
            showMessage('تم الحفظ بنجاح ✓');
            btn.disabled = false;
        }

        function editStudent(id) {
            const student = students.find(s => s.id === id);
            if (student) {
                document.getElementById('studentName').value = student.name;
                document.getElementById('section').value = student.section;
                document.getElementById('joinDate').value = student.joinDate;
                document.getElementById('monthlyRate').value = student.monthlyRate;
                document.getElementById('teacher').value = student.teacher;
                editingId = id;
                document.getElementById('studentSubmitBtn').textContent = '✏️ تحديث';
                window.scrollTo(0, 0);
            }
        }

        async function deleteStudent(id) {
            if (confirm('هل متأكد من الحذف؟')) {
                students = students.filter(s => s.id !== id);
                filteredStudents = [...students];
                saveData();
                renderAll();
                showMessage('تم الحذف ✓');
            }
        }

        function filterStudents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredStudents = students.filter(s => 
                s.name.toLowerCase().includes(searchTerm) ||
                s.section.includes(searchTerm)
            );
            renderStudents();
        }

        function showStudentDetails(id) {
            const student = students.find(s => s.id === id);
            if (!student) return;

            const modal = document.getElementById('studentModal');
            const modalBody = document.getElementById('modalBody');
            
            const joinDateObj = new Date(student.joinDate);
            let statusText = student.isGift ? '🎁 هدية' : (student.totalPaid > 0 ? '✅ مدفوع' : '⏳ معلق');
            
            let paymentsHTML = '<h4>📊 سجل الدفعات:</h4>';
            if (student.payments.length === 0) {
                paymentsHTML += '<p>لم يتم أي دفعات</p>';
            } else {
                paymentsHTML += '<ul style="list-style: none;">';
                student.payments.forEach((payment, index) => {
                    paymentsHTML += `<li style="padding: 8px; margin: 5px 0; background: #d4edda; border-radius: 5px;">✅ الدفعة ${index + 1}: ${payment} د</li>`;
                });
                paymentsHTML += '</ul>';
            }
            
            modalBody.innerHTML = `
                <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <p><strong>👤 الاسم:</strong> ${student.name}</p>
                    <p><strong>📚 القسم:</strong> ${student.section}</p>
                    <p><strong>👨‍🏫 المعلمة:</strong> ${teachers.find(t => t.id === student.teacher)?.name || '-'}</p>
                    <p><strong>📅 تاريخ:</strong> ${joinDateObj.toLocaleDateString('en-CA')}</p>
                </div>
                
                <div style="background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <p><strong>💰 السعر:</strong> ${student.monthlyRate} د</p>
                    <p><strong>📈 الدفعات:</strong> ${student.payments.length}</p>
                    <p><strong>✅ المدفوع:</strong> ${student.totalPaid} د</p>
                    <p><strong>📋 الحالة:</strong> <span class="badge ${student.isGift ? 'badge-gift' : 'badge-success'}">${statusText}</span></p>
                </div>
                
                ${paymentsHTML}
            `;
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('studentModal').classList.remove('active');
        }

        function clearForm() {
            document.getElementById('studentName').value = '';
            document.getElementById('section').value = 'قرآن';
            document.getElementById('joinDate').value = '';
            document.getElementById('monthlyRate').value = '';
            document.getElementById('teacher').value = '1';
        }

        function showMessage(msg, isError) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = msg;
            msgEl.className = isError ? 'error' : '';
            msgEl.style.display = 'block';
            setTimeout(() => msgEl.style.display = 'none', 3000);
        }

        function calculateStats() {
            const studentRevenue = students.reduce((sum, s) => sum + s.totalPaid, 0);
            const totalExpenses = customExpenses.reduce((sum, e) => sum + e.amount, 0);
            const teachersShare = studentRevenue * 0.5;
            const totalIncome = studentRevenue + capitalAmount;
            const netProfit = totalIncome - totalExpenses - teachersShare;

            return {
                studentRevenue,
                capitalAmount,
                totalIncome,
                totalExpenses,
                teachersShare,
                netProfit,
                totalStudents: students.length
            };
        }

        function renderStudents() {
            let html = '';
            if (filteredStudents.length === 0) {
                html = '<div class="empty-state"><p>لا توجد طالبات</p></div>';
            } else {
                html += '<table><thead><tr><th>الاسم</th><th>القسم</th><th>المعلمة</th><th>تاريخ</th><th>السعر</th><th>الدفعات</th><th>المدفوع</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>';
                filteredStudents.forEach(student => {
                    const teacher = teachers.find(t => t.id === student.teacher);
                    let statusClass = student.isGift ? 'badge-gift' : (student.totalPaid > 0 ? 'badge-success' : 'badge-warning');
                    let statusText = student.isGift ? '🎁 هدية' : (student.totalPaid > 0 ? '✅ مدفوع' : '⏳ معلق');
                    
                    html += `<tr>
                        <td><strong>${student.name}</strong></td>
                        <td>${student.section}</td>
                        <td>${teacher?.name || '-'}</td>
                        <td>${new Date(student.joinDate).toLocaleDateString('en-CA')}</td>
                        <td>${student.monthlyRate} د</td>
                        <td>${student.payments.length}</td>
                        <td>${student.totalPaid} د</td>
                        <td><span class="badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn-small btn-info" onclick="showStudentDetails(${student.id})">عرض</button>
                            <button class="btn-small btn-edit" onclick="editStudent(${student.id})">تعديل</button>
                            <button class="btn-small btn-delete" onclick="deleteStudent(${student.id})">حذف</button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }
            document.getElementById('studentsTable').innerHTML = html;
        }

        function renderExpenses() {
            const stats = calculateStats();

            let html = `
                <div class="stat-card warning">
                    <h3>💸 إجمالي المصاريف</h3>
                    <div class="value">${stats.totalExpenses.toFixed(2)} د</div>
                </div>

                <h3 class="section-title">تفاصيل المصاريف</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr style="background: #ffc107; color: #333;">
                                <th>اسم المصروف</th>
                                <th>المبلغ</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            customExpenses.forEach(expense => {
                html += `<tr>
                    <td><strong>${expense.name}</strong></td>
                    <td>${expense.amount.toFixed(2)} د</td>
                    <td>
                        <button class="btn-small btn-edit" onclick="editExpense(${expense.id})">تعديل</button>
                        <button class="btn-small btn-delete" onclick="deleteExpense(${expense.id})">حذف</button>
                    </td>
                </tr>`;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('expensesContent').innerHTML = html;
        }

        function renderProfit() {
            const stats = calculateStats();

            let html = `
                <div class="stats">
                    <div class="stat-card">
                        <h3>💰 إيرادات الطالبات</h3>
                        <div class="value">${stats.studentRevenue.toFixed(2)} د</div>
                    </div>
                    <div class="stat-card">
                        <h3>💵 رأس المال</h3>
                        <div class="value">+ ${stats.capitalAmount.toFixed(2)} د</div>
                    </div>
                    <div class="stat-card">
                        <h3>📊 إجمالي الإيرادات</h3>
                        <div class="value">${stats.totalIncome.toFixed(2)} د</div>
                    </div>
                </div>

                <h3 class="section-title">حساب صافي الربح</h3>

                <div style="background: #f8f9fa; padding: 20px; border-radius: 10px; margin-top: 20px;">
                    <div class="income-item">
                        <strong>إجمالي الإيرادات</strong>
                        <span>${stats.totalIncome.toFixed(2)} د</span>
                    </div>

                    <div class="expense-item" style="margin-top: 15px;">
                        <strong>❌ خصم المصاريف</strong>
                        <span>- ${stats.totalExpenses.toFixed(2)} د</span>
                    </div>

                    <div class="expense-item">
                        <strong>❌ خصم نصيب المعلمات (50%)</strong>
                        <span>- ${stats.teachersShare.toFixed(2)} د</span>

                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <strong style="color: #155724; font-size: 1.1em;">✅ صافي الربح النهائي</strong>
                            <span style="color: #155724; font-weight: bold; font-size: 1.3em;">${stats.netProfit.toFixed(2)} د</span>
                        </div>
                    </div>
                </div>

                <div class="stat-card success" style="margin-top: 20px;">
                    <h3>✅ صافي الربح</h3>
                    <div class="value">${stats.netProfit.toFixed(2)} د</div>
                </div>
            `;

            document.getElementById('profitContent').innerHTML = html;
        }

        function renderTeachers() {
            let html = `<div style="overflow-x: auto;">
                    <table style="min-width: 1000px;">
                        <thead>
                            <tr style="background: #667eea; color: white;">
                                <th>👨‍🏫 المعلمة</th>
                                <th>📚 القسم</th>
                                <th>👥 الطالبات</th>
                                <th>💰 الإيرادات</th>
                                <th>💵 النصيب (50%)</th>
                            </tr>
                        </thead>
                        <tbody>`;
            
            teachers.forEach(teacher => {
                const teacherStudents = students.filter(s => s.teacher === teacher.id);
                const teacherRevenue = teacherStudents.reduce((sum, s) => sum + s.totalPaid, 0);
                const teacherShare = teacherRevenue * 0.5;
                
                html += `<tr style="border-bottom: 1px solid #ddd;">
                    <td><strong style="color: #667eea;">${teacher.name}</strong></td>
                    <td><strong>${teacher.section}</strong></td>
                    <td>${teacherStudents.length}</td>
                    <td><strong>${teacherRevenue.toFixed(2)} د</strong></td>
                    <td><strong style="color: #667eea;">${teacherShare.toFixed(2)} د</strong></td>
                </tr>`;
            });
            
            html += `</tbody></table></div>`;
            
            document.getElementById('teachersContent').innerHTML = html;
        }

        function resetAllData() {
            if (confirm('هل تريد إعادة تعيين البيانات؟')) {
                students = JSON.parse(JSON.stringify(initialStudents));
                customExpenses = JSON.parse(JSON.stringify(defaultExpenses));
                sessions = JSON.parse(JSON.stringify(defaultSessions));
                saveData();
                filteredStudents = [...students];
                renderAll();
                renderSessions();
                showMessage('تمت إعادة التعيين ✓');
            }
        }

        function renderAll() {
            renderStudents();
            renderSessions();
        }

        document.addEventListener('click', function(event) {
            const modal = document.getElementById('studentModal');
            if (event.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>
